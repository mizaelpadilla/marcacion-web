<h2 class="page-title-blue">Seguridad de Acceso</h2>
<div class="header-inline-left">
  <button class="btn-action-blue" (click)="abrirModalCrear()">+ Agregar Acceso</button>
</div>

<div class="table-card-modern">
  <table class="styled-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre de Usuario</th>
        <th>Rol / Permisos</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (user of listaUsuarios; track user.idUsuario) {
        <tr>
          <td>{{ user.idUsuario }}</td>
          <td class="bold-text">{{ user.usuarioNombre }}</td>
          <td><span class="status-pill active">{{ user.rol }}</span></td>
          <td class="acciones">
            <button class="btn-icon-edit" (click)="abrirModalEditar(user)"><i class="bi bi-pencil-square"></i></button>
            <button class="btn-icon-delete" (click)="desactivarUsuario(user.idUsuario!)"><i class="bi bi-shield-x"></i></button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<!-- MODAL REDISEÑADO USUARIO -->
@if (mostrarModalCrear) {
<div class="modal-backdrop">
  <div class="modal-content-solid">
    <div class="modal-header">
        <h3>Registrar Acceso al Sistema</h3>
        <span class="close-btn" (click)="cerrarModalCrear()">&times;</span>
    </div>
    <div class="modal-body">
        <div class="form-group full-width" [class.valid]="nuevoUsuario.idEmpleado > 0">
            <label>Seleccionar Empleado</label>
            <div class="input-container">
                <select [(ngModel)]="nuevoUsuario.idEmpleado">
                    <option [value]="0" disabled>-- Seleccione --</option>
                    @for (emp of listaEmpleados; track emp.idEmpleado) {
                        <option [value]="emp.idEmpleado">{{ emp.nombres }} {{ emp.apellidos }}</option>
                    }
                </select>
                <i class="bi bi-check-circle-fill validation-check"></i>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group" [class.valid]="nuevoUsuario.usuarioNombre">
                <label>Nombre de Usuario</label>
                <div class="input-container">
                    <input type="text" [(ngModel)]="nuevoUsuario.usuarioNombre" placeholder="Ej: jdoe">
                    <i class="bi bi-check-circle-fill validation-check"></i>
                </div>
            </div>
            <div class="form-group" [class.valid]="nuevoUsuario.rol">
                <label>Rol</label>
                <div class="input-container">
                    <select [(ngModel)]="nuevoUsuario.rol">
                        <option value="Administrador">Administrador</option>
                        <option value="Usuario">Usuario</option>
                    </select>
                    <i class="bi bi-check-circle-fill validation-check"></i>
                </div>
            </div>
        </div>
        <div class="form-group full-width" [class.valid]="nuevoUsuario.clave && nuevoUsuario.clave.length >= 6">
            <label>Contraseña</label>
            <div class="input-container">
                <input type="password" [(ngModel)]="nuevoUsuario.clave" placeholder="Mínimo 6 caracteres">
                <i class="bi bi-check-circle-fill validation-check"></i>
            </div>
        </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secundario" (click)="cerrarModalCrear()">Cancelar</button>
      <button class="btn-primario" (click)="guardarNuevoUsuario()">Guardar Acceso</button>
    </div>
  </div>
</div>
}

@if (mostrarModalEditar) {
<div class="modal-backdrop">
  <div class="modal-content-solid">
    <div class="modal-header">
        <h3>Modificar Rol</h3>
        <span class="close-btn" (click)="cerrarModalEditar()">&times;</span>
    </div>
    <div class="modal-body">
        <div class="form-group full-width valid">
            <label>Usuario Seleccionado</label>
            <div class="input-container">
                <input type="text" [value]="usuarioSeleccionado.usuarioNombre" disabled>
                <i class="bi bi-check-circle-fill validation-check"></i>
            </div>
        </div>
        <div class="form-group full-width valid">
            <label>Asignar Nuevo Rol</label>
            <div class="input-container">
                <select [(ngModel)]="usuarioSeleccionado.rol">
                    <option value="Administrador">Administrador</option>
                    <option value="Usuario">Usuario</option>
                </select>
                <i class="bi bi-check-circle-fill validation-check"></i>
            </div>
        </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secundario" (click)="cerrarModalEditar()">Cancelar</button>
      <button class="btn-primario" (click)="guardarCambioRol()">Actualizar</button>
    </div>
  </div>
</div>
}
