<div class="login-container">

  <h1>Sistema de Marcación</h1>

  <input
    type="text"
    placeholder="Usuario"
    [(ngModel)]="usuario">

  <input
    type="password"
    placeholder="Contraseña"
    [(ngModel)]="clave">

  <button (click)="iniciarSesion()">
    Iniciar Sesión
  </button>

</div>
